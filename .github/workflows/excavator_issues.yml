on:
  workflow_run:
    workflows: [Excavator]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Id of the Excavator run to report on
        required: true
name: Excavator Issues
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  report:
    name: Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Report Excavator errors
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          RUN_FAILED: ${{ github.event.workflow_run.conclusion == 'failure' }}
        run: ./scripts/excavator-issues.ps1 -RunId $env:RUN_ID -RunFailed:($env:RUN_FAILED -eq 'true')
